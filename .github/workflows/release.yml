name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows Release Build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check Out Source
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set Up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Tests
        run: npm test

      - name: Test Build Guard
        shell: powershell
        run: ./tests/build-guard.ps1

      - name: Install Browser
        run: npx playwright install msedge

      - name: Build Frontend And Run Browser Tests
        run: npm run test:e2e

      - name: Run Rust Tests
        run: npm run test:rust -- --locked

      - name: Build Windows Installer
        run: npm run dist -- -- --locked
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Create Installer Checksum
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'No NSIS installer was produced.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Out-File -FilePath artifacts/insyndoc-installer-sha256.txt -Encoding ascii
          Write-Host "Installer: $($installer.Name)"
          Write-Host "SHA256: $hash"

      - name: Create Updater Manifest
        shell: powershell
        run: |
          $bundleDir = 'src-tauri/target/release/bundle/nsis'
          $setup = Get-ChildItem "$bundleDir/*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw 'No NSIS installer was produced.' }
          $signaturePath = "$($setup.FullName).sig"
          if (-not (Test-Path $signaturePath)) { throw 'Missing updater signature file.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = '${{ github.ref_name }}'
          $manifest = [ordered]@{
            version = $version
            notes = ''
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content $signaturePath -Raw).Trim()
                url = "https://github.com/insanmiy/InsynDoc/releases/download/$tag/$($setup.Name)"  
              }
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText("$bundleDir/latest.json", $json, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "Wrote $bundleDir/latest.json for $version"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
            artifacts/insyndoc-installer-sha256.txt
            THIRD_PARTY_NOTICES.md
          generate_release_notes: true
