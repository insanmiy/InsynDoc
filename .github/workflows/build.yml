name: Test And Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Tests And Installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check Out Source
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set Up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Tests
        run: npm test

      - name: Test Build Guard
        shell: powershell
        run: ./tests/build-guard.ps1

      - name: Install Browser
        run: npx playwright install msedge

      - name: Build Frontend And Run Browser Tests
        run: npm run test:e2e

      - name: Run Rust Tests
        run: npm run test:rust -- --locked

      - name: Build Windows Installer
        run: npm run dist -- -- --locked

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: InsynDoc-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Browser Failure Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Browser-Failure-Diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
