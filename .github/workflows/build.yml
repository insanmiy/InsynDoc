name: Test And Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HOME: 'C:\actions-runner\.cargo'
  RUSTUP_HOME: 'C:\actions-runner\.rustup'
  npm_config_cache: 'C:\actions-runner\.npm'

jobs:
  windows:
    name: Windows Tests And Installer
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Protect Local Paths
        shell: powershell
        run: |
          $privatePaths = @($env:USERPROFILE, $env:APPDATA, $env:LOCALAPPDATA, $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:RUNNER_TOOL_CACHE)
          foreach ($privatePath in $privatePaths) {
            if ([string]::IsNullOrWhiteSpace($privatePath)) { continue }
            Write-Output "::add-mask::$privatePath"
            Write-Output "::add-mask::$($privatePath.Replace('\', '/'))"
          }
          $pathMappings = [ordered]@{
            'C:\actions-runner' = '/runner'
          }
          if ($env:USERPROFILE) { $pathMappings[$env:USERPROFILE] = '/user' }
          if ($env:GITHUB_WORKSPACE) { $pathMappings[$env:GITHUB_WORKSPACE] = '/workspace' }
          $rustFlags = foreach ($mapping in $pathMappings.GetEnumerator()) {
            "--remap-path-prefix=$($mapping.Key)=$($mapping.Value)"
            "--remap-path-prefix=$($mapping.Key.Replace('\', '/'))=$($mapping.Value)"
          }
          "CARGO_ENCODED_RUSTFLAGS=$($rustFlags -join [char]31)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check Out Source
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set Up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Dependencies
        run: npm ci

      - name: Prepare App Assets
        run: node scripts/prepare-assets.mjs

      - name: Run Frontend Tests
        run: npx vitest run

      - name: Run Release Note Tests
        run: node --test tests/release-notes.test.mjs

      - name: Run Rust Tests
        run: npm run test:rust -- --locked

      - name: Build Windows Installer
        run: npm run dist -- -- --locked
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: InsynDoc-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
