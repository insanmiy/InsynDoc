[package]
name = "insyndoc"
version = "1.0.2"
description = "Offline Windows DOCX editor"
authors = ["InsynDoc"]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[lib]
name = "insyndoc_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rfd = "0.17"
tempfile = "3"
unicode-segmentation = "1.13"
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"
windows-registry = "0.6.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
