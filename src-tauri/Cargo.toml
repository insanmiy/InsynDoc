[package]
name = "insyndoc"
version = "1.0.0"
description = "Offline Windows DOCX Editor"
authors = ["InsynDoc"]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[lib]
name = "insyndoc_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rfd = "0.17"
tempfile = "3"
unicode-segmentation = "1.13"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
